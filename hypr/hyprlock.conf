# ~/.config/hypr/hyprlock.conf
# Starter hyprlock config: blurred background, big clock, date, greeting, password box

general {
    hide_cursor = true
}

# ---------- Background ----------
background {
    monitor = eDP-1
    path = ~/Downloads/Wallpapers/car.png        # blurs whatever is on screen. Or use an image: ~/Pictures/wall.png
    blur_passes = 3         # 0 = no blur
    blur_size = 1
    brightness = 1        # lower = darker
}

# ---------- Clock ----------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"     # 12-hour: date +"%I:%M %p"
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = Inter Light
    position = 0, 200
    halign = center
    valign = center
}

# ---------- Date ----------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(255, 255, 255, 0.8)
    font_size = 22
    font_family = Inter Light
    position = 0, 110
    halign = center
    valign = center
}

# ---------- Greeting ----------
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = Inter Light
    position = 0, -20
    halign = center
    valign = center
}

# ---------- Password box ----------
input-field {
    monitor =
    size = 300, 55
    rounding = 15
    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(255, 255, 255)
    check_color = rgb(137, 180, 250)     # outline while checking password
    fail_color = rgb(243, 139, 168)      # outline on wrong password
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -90
    halign = center
    valign = center
}
